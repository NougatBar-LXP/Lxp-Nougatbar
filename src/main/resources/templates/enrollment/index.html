<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta content="width=device-width, initial-scale=1" name="viewport">
  <title>ConnectLearn - 내 학습방</title>

  <link crossorigin="anonymous"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/global/theme.css}">
  <link rel="stylesheet" th:href="@{/css/global/header.css}">

  <style>
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: #f8f8ff;
      color: #1f2430;
    }

    main {
      flex: 1;
    }

    .learning-shell {
      max-width: 1180px;
      margin: 0 auto;
      padding: 42px 18px 72px;
    }

    .page-title {
      margin-bottom: 14px;
      font-size: 34px;
      font-weight: 800;
      letter-spacing: 0;
    }

    .page-subtitle {
      margin-bottom: 38px;
      color: #4b5563;
      font-size: 16px;
    }

    .learning-tabs {
      display: flex;
      gap: 28px;
      border-bottom: 1px solid #cfd3e2;
      margin-bottom: 38px;
    }

    .learning-tab {
      position: relative;
      border: 0;
      padding: 0 2px 13px;
      background: transparent;
      color: #353b4c;
      font-weight: 700;
    }

    .learning-tab.active {
      color: #6423d6;
    }

    .learning-tab.active::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: -1px;
      height: 3px;
      background: #6423d6;
      border-radius: 3px 3px 0 0;
    }

    .learning-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 24px;
    }

    .learning-card {
      overflow: hidden;
      border: 1px solid #dce0ee;
      border-radius: 10px;
      background: #fff;
      box-shadow: 0 12px 26px rgba(31, 36, 48, 0.04);
    }

    .thumb-wrap {
      position: relative;
      height: 182px;
      background: #eceff6;
    }

    .thumb-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .category-pill {
      position: absolute;
      top: 16px;
      left: 16px;
      border-radius: 4px;
      padding: 6px 11px;
      background: rgba(255, 255, 255, 0.82);
      color: #4b5563;
      font-size: 12px;
      font-weight: 700;
    }

    .learning-body {
      padding: 24px 22px 22px;
    }

    .learning-title {
      min-height: 56px;
      margin-bottom: 12px;
      font-size: 21px;
      font-weight: 800;
      line-height: 1.35;
    }

    .learning-desc {
      min-height: 44px;
      margin-bottom: 28px;
      color: #5b6274;
      font-size: 14px;
      line-height: 1.55;
    }

    .progress-head {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 8px;
      font-size: 12px;
      font-weight: 700;
    }

    .progress-head strong {
      color: #6423d6;
    }

    .learning-progress {
      height: 8px;
      border-radius: 999px;
      background: #e3e4f7;
      overflow: hidden;
    }

    .learning-progress span {
      display: block;
      width: 8%;
      height: 100%;
      border-radius: inherit;
      background: #6423d6;
    }

    .mission-line {
      display: flex;
      justify-content: space-between;
      margin-top: 16px;
      font-size: 12px;
      font-weight: 700;
    }

    .empty-state {
      border: 1px solid #dce0ee;
      border-radius: 10px;
      padding: 34px;
      background: #fff;
      color: #5b6274;
    }

    @media (max-width: 980px) {
      .learning-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 640px) {
      .learning-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
<div th:replace="~{fragments/header::header}"></div>

<main>
  <div class="learning-shell">
    <h1 class="page-title">내 학습방</h1>
    <p class="page-subtitle">현재 수강 중인 강좌의 진도와 미션을 확인하세요.</p>

    <nav class="learning-tabs" aria-label="학습 상태">
      <button class="learning-tab active" type="button" th:text="|수강 중 (${enrollmentCount})|">수강 중 (0)</button>
      <button class="learning-tab" type="button">완료된 강좌</button>
      <button class="learning-tab" type="button">찜한 강좌</button>
    </nav>

    <section class="learning-grid" th:if="${!#lists.isEmpty(enrollments)}">
      <article class="learning-card" th:each="enrollment : ${enrollments}"
               th:with="course=${courseMap[enrollment.courseId()]}">
        <div class="thumb-wrap">
          <img alt="강좌 썸네일"
               th:attr="onerror=|this.onerror=null;this.src='@{/images/nougatbar.png}';|"
               th:src="${thumbnailUrlMap[enrollment.courseId()] != null ? thumbnailUrlMap[enrollment.courseId()] : '/images/nougatbar.png'}">
          <span class="category-pill"
                th:text="${course != null ? course.level() : 'Course'}">Course</span>
        </div>

        <div class="learning-body">
          <h2 class="learning-title"
              th:text="${course != null ? course.title() : 'Course #' + enrollment.courseId()}">강좌명</h2>
          <p class="learning-desc"
             th:text="${course != null ? course.description() : '수강 중인 강좌입니다.'}">강좌 설명</p>

          <div class="progress-head">
            <span>진도율 <span>(완료 0 / 전체 12)</span></span>
            <strong th:text="${enrollment.status().name() == 'Completed' ? '100%' : '8%'}">8%</strong>
          </div>
          <div class="learning-progress">
            <span th:style="${enrollment.status().name() == 'Completed' ? 'width: 100%' : 'width: 8%'}"></span>
          </div>

          <div class="mission-line">
            <span>PASS 미션</span>
            <strong th:text="${enrollment.status().name() == 'Completed' ? '완료' : '0 / 3 개'}">0 / 3 개</strong>
          </div>
        </div>
      </article>
    </section>

    <section class="empty-state" th:if="${#lists.isEmpty(enrollments)}">
      아직 수강 중인 강좌가 없습니다.
      <a class="ms-1" th:href="@{/courses}">강좌 둘러보기</a>
    </section>
  </div>
</main>

<div th:replace="~{fragments/footer::footer}"></div>

<script crossorigin="anonymous"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
