<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ConnectLearn</title>

  <!-- 1. Bootstrap CDN (반드시 먼저 로드) -->
  <link crossorigin="anonymous"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        rel="stylesheet">

  <!-- 2. 공용 컬러 테마 (Bootstrap 이후 로드해야 오버라이드 적용) -->
  <link rel="stylesheet" th:href="@{/css/global/theme.css}">

  <!-- 3. 공용 스타일 -->
  <link rel="stylesheet" th:href="@{/css/global/header.css}">
</head>
<body>

<div th:replace="~{fragments/header::header}"></div>

<main class="container">
  <!-- 검색 창 -->
  <div class="col-md-6 mx-auto">
    <form class="my-4" method="get" th:action="@{/courses}">
      <div class="input-group">
        <label class="flex-fill">
          <input class="form-control" name="q" placeholder="Search..." required type="text">
        </label>
        <button class="btn btn-primary" type="submit">Search</button>
      </div>
    </form>
  </div>

  <!-- 강좌 리스트 시작 4 column -->
  <div class="row g-4 mb-4" th:if="${!#lists.isEmpty(courses)}">
    <div class="col-12 col-sm-6 col-lg-4 col-xl-3" th:each="course : ${courses}">
      <a class="card h-100 text-decoration-none text-body shadow-sm"
         th:href="@{/courses/{courseId}(courseId=${course.courseId()})}"
         th:with="thumbnailUrl=${thumbnailUrlMap[course.courseId()]}">
        <img alt="강좌 썸네일"
             class="card-img-top"
             style="height: 160px; object-fit: cover;"
             th:if="${thumbnailUrl != null}"
             th:src="${thumbnailUrl}">
        <div
            class="card-img-top d-flex align-items-center justify-content-center bg-light text-muted"
            style="height: 160px;"
            th:if="${thumbnailUrl == null}">
          No Image
        </div>

        <div class="card-body d-flex flex-column">
          <p class="mb-2">
            <span class="badge text-bg-light"
                  th:if="${course.courseTags() != null and !course.courseTags().isEmpty()}"
                  th:text="${course.courseTags().get(0)}">태그</span>
            <span class="badge text-bg-light"
                  th:if="${course.courseTags() == null or course.courseTags().isEmpty()}">태그 없음</span>
          </p>

          <h5 class="card-title text-truncate" th:text="${course.courseTitle()}">강좌 제목</h5>
          <p class="card-text text-secondary small mb-3"
             style="min-height: 48px;"
             th:text="${course.courseDescription()}">강좌 설명</p>

          <div class="small text-muted mb-2">
            <span th:text="${course.courseLevel()}">BEGINNER</span>
            <span class="mx-1">|</span>
            <span th:text="${course.instructorName()}">강사명</span>
          </div>

          <div class="fw-semibold mt-auto"
               th:text="${#numbers.formatInteger(course.coursePrice(), 0, 'COMMA')} + '원'">0원
          </div>
        </div>
      </a>
    </div>
  </div>
  <div class="alert alert-light mb-4" role="status" th:if="${#lists.isEmpty(courses)}">
    표시할 강좌가 없습니다.
  </div>
  <!-- 강좌 리스트 끝 -->
</main>

<div th:replace="~{fragments/footer::footer}"></div>

<script crossorigin="anonymous"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
