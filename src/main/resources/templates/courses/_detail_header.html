<th:block th:fragment="header(activeTab)" xmlns:th="http://www.thymeleaf.org">
  <section class="course-hero-bg text-white py-5">
    <div class="container">
      <div class="row g-5 align-items-start">
        <div class="col-lg-8">
          <nav aria-label="breadcrumb" class="mb-3">
            <ol class="breadcrumb mb-0">
              <li class="breadcrumb-item">
                <a class="text-white-50 text-decoration-none" th:href="@{/courses}">강의</a>
              </li>
              <li class="breadcrumb-item active text-white" aria-current="page"
                  th:text="|코스 ${course.courseId}|">코스 1</li>
            </ol>
          </nav>

          <h1 class="fw-bold mb-3 course-hero-title" th:text="${course.courseTitle}">강좌 제목</h1>
          <p class="text-white-75 mb-4 fs-6 lh-lg" th:text="${course.courseDescription}">강좌 설명</p>

          <div class="d-flex flex-wrap gap-2 mb-3">
            <span class="badge text-bg-light fw-semibold" th:text="${course.courseStatus}">PUBLISHED</span>
            <span class="badge text-bg-light fw-semibold" th:text="${course.courseLevel}">BEGINNER</span>
            <span class="badge text-bg-light fw-semibold" th:text="|강의 ID ${course.courseId}|">강의 ID 1</span>
            <span class="badge text-bg-light fw-semibold" th:text="|지식공유자 ${course.instructorName}|">지식공유자</span>
          </div>

          <div class="d-flex flex-wrap gap-2"
               th:if="${course.courseTags != null and !course.courseTags.isEmpty()}">
            <span class="badge rounded-pill bg-white bg-opacity-25 text-white fw-semibold"
                  th:each="tag : ${course.courseTags}"
                  th:text="${tag}">태그</span>
          </div>
        </div>

        <div class="col-lg-4">
          <div class="card shadow-lg border-0 overflow-hidden enroll-card">
            <img class="enroll-thumbnail"
                 th:src="${thumbnailUrl}"
                 th:alt="${course.courseTitle}"
                 th:attr="onerror=|this.onerror=null;this.src='@{/images/nougatbar.png}';|"
                 alt="강좌 썸네일">

            <div class="card-body">
              <p class="fs-4 fw-bold mb-3"
                 th:text="${#numbers.formatInteger(course.coursePrice, 0, 'COMMA')} + '원'">0원</p>

              <div class="d-grid gap-2 mb-3">
                <a class="btn btn-primary" href="#">수강신청 하기</a>
                <form method="post" th:action="@{/cart-ui}">
                  <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                  <input type="hidden" name="courseId" th:value="${course.courseId}">
                  <button type="submit" class="btn btn-outline-secondary w-100">바구니에 담기</button>
                </form>
              </div>

              <hr class="my-2">
              <dl class="row mb-0 small">
                <dt class="col-5 text-muted fw-semibold">강의 상태</dt>
                <dd class="col-7 fw-semibold mb-2" th:text="${course.courseStatus}">PUBLISHED</dd>

                <dt class="col-5 text-muted fw-semibold">난이도</dt>
                <dd class="col-7 fw-semibold mb-2" th:text="${course.courseLevel}">BEGINNER</dd>

                <dt class="col-5 text-muted fw-semibold">코스 ID</dt>
                <dd class="col-7 fw-semibold mb-0" th:text="${course.courseId}">1</dd>
              </dl>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <nav class="bg-white border-bottom sticky-top course-tab-nav" aria-label="강의 상세 메뉴">
    <div class="container">
      <ul class="nav mb-0">
        <li class="nav-item">
          <a class="nav-link course-tab-link"
             th:classappend="${activeTab != 'community'} ? ' active'"
             th:attr="aria-current=${activeTab != 'community' ? 'page' : null}"
             th:href="@{/courses/{courseId}(courseId=${course.courseId})}">커리큘럼</a>
        </li>
        <li class="nav-item">
          <a class="nav-link course-tab-link"
             th:classappend="${activeTab == 'community'} ? ' active'"
             th:attr="aria-current=${activeTab == 'community' ? 'page' : null}"
             th:href="@{/courses/{courseId}/community(courseId=${course.courseId})}">커뮤니티</a>
        </li>
      </ul>
    </div>
  </nav>
</th:block>
