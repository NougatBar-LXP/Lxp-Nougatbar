<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LXP Cart</title>
    <style>
        :root {
            --bg: #f7f8fa;
            --panel: #ffffff;
            --text: #1f2933;
            --muted: #6b7280;
            --line: #e5e7eb;
            --green: #00c471;
            --green-dark: #00a85f;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-width: 320px;
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: "Pretendard", "Apple SD Gothic Neo", "Segoe UI", sans-serif;
        }

        button {
            font: inherit;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        h1,
        h2,
        p {
            margin-top: 0;
        }

        .site-header {
            border-bottom: 1px solid var(--line);
            background: #fff;
        }

        .header-inner,
        .page {
            width: min(1080px, calc(100% - 40px));
            margin: 0 auto;
        }

        .header-inner {
            display: flex;
            min-height: 64px;
            align-items: center;
            justify-content: space-between;
            gap: 18px;
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-size: 20px;
            font-weight: 900;
        }

        .brand-mark {
            display: grid;
            width: 34px;
            height: 34px;
            place-items: center;
            border-radius: 8px;
            background: var(--green);
            color: #fff;
        }

        .member-chip {
            display: inline-flex;
            min-height: 34px;
            align-items: center;
            border: 1px solid var(--line);
            border-radius: 999px;
            padding: 0 12px;
            color: var(--muted);
            font-size: 14px;
            font-weight: 800;
        }

        .page {
            display: grid;
            gap: 34px;
            padding: 34px 0 70px;
        }

        .summary {
            display: flex;
            align-items: end;
            justify-content: space-between;
            gap: 20px;
        }

        .summary h1 {
            margin-bottom: 10px;
            font-size: 32px;
            line-height: 1.25;
            letter-spacing: 0;
        }

        .summary h2 {
            margin-bottom: 0;
            color: var(--green-dark);
            font-size: 22px;
            line-height: 1.35;
            letter-spacing: 0;
        }

        .section-heading {
            margin-bottom: 14px;
            font-size: 24px;
            line-height: 1.32;
        }

        .course-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 14px;
        }

        .course-card,
        .cart-item,
        .empty {
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--panel);
        }

        .course-card {
            display: grid;
            grid-template-columns: 132px minmax(0, 1fr);
            overflow: hidden;
        }

        .thumbnail {
            position: relative;
            display: grid;
            min-height: 132px;
            place-items: center;
            overflow: hidden;
            background: linear-gradient(135deg, rgba(0, 196, 113, 0.95), rgba(37, 99, 235, 0.92));
            color: #fff;
            font-size: 26px;
            font-weight: 900;
        }

        .thumbnail img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .course-body,
        .item-body {
            min-width: 0;
            padding: 18px;
        }

        .course-body h2,
        .item-body h2 {
            margin-bottom: 8px;
            font-size: 21px;
            line-height: 1.35;
        }

        .description {
            display: -webkit-box;
            overflow: hidden;
            margin-bottom: 14px;
            color: #4b5563;
            line-height: 1.55;
            -webkit-box-orient: vertical;
            -webkit-line-clamp: 2;
        }

        .meta {
            display: flex;
            flex-wrap: wrap;
            gap: 8px 14px;
            align-items: center;
            color: var(--muted);
            font-size: 14px;
            font-weight: 700;
        }

        .price {
            color: var(--text);
            font-size: 18px;
            font-weight: 900;
        }

        .course-actions,
        .item-actions {
            display: flex;
            justify-content: flex-end;
            margin-top: 16px;
        }

        .primary-button,
        .secondary-button,
        .danger-button,
        .done-button {
            display: inline-flex;
            min-height: 40px;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            padding: 0 16px;
            cursor: pointer;
            font-weight: 900;
        }

        .primary-button {
            border: 0;
            background: var(--green);
            color: #fff;
        }

        .primary-button:hover {
            background: var(--green-dark);
        }

        .secondary-button {
            border: 1px solid var(--line);
            background: #fff;
            color: var(--text);
        }

        .danger-button {
            border: 1px solid #fecdd3;
            background: #fff1f2;
            color: #be123c;
        }

        .done-button {
            border: 0;
            background: #eef2f7;
            color: var(--muted);
            cursor: default;
        }

        .cart-header {
            position: sticky;
            top: var(--cart-sticky-top, 12px);
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            margin: -10px -10px 14px;
            border: 1px solid rgba(229, 231, 235, 0.9);
            border-radius: 8px;
            padding: 10px;
            background: rgba(247, 248, 250, 0.94);
            backdrop-filter: blur(10px);
        }

        .cart-header .section-heading {
            margin-bottom: 0;
        }

        .cart-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }

        .cart-total {
            display: inline-flex;
            min-height: 40px;
            align-items: center;
            gap: 10px;
            border: 1px solid var(--line);
            border-radius: 4px;
            padding: 0 14px;
            background: #fff;
        }

        .cart-total span {
            color: var(--muted);
            font-size: 13px;
            font-weight: 800;
        }

        .cart-total strong {
            color: var(--text);
            font-size: 18px;
            font-weight: 900;
        }

        .cart-list {
            display: grid;
            gap: 14px;
        }

        .cart-item {
            display: grid;
            grid-template-columns: 168px minmax(0, 1fr);
            overflow: hidden;
        }

        .empty {
            display: grid;
            min-height: 220px;
            place-items: center;
            text-align: center;
        }

        .empty h2 {
            margin-bottom: 8px;
            font-size: 22px;
        }

        .empty p {
            margin-bottom: 0;
            color: var(--muted);
        }

        @media (max-width: 900px) {
            .course-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 720px) {
            .header-inner,
            .page {
                width: min(100% - 28px, 1080px);
            }

            .summary,
            .cart-header {
                align-items: start;
                flex-direction: column;
            }

            .cart-actions {
                display: grid;
                width: 100%;
            }

            .cart-total {
                justify-content: space-between;
                width: 100%;
            }

            .cart-actions form,
            .cart-actions button {
                width: 100%;
            }

            .course-card,
            .cart-item {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
<header class="site-header">
    <div class="header-inner">
        <a class="brand" th:href="@{/cart-ui(memberId=${memberId})}">
            <span class="brand-mark">L</span>
            <span>LXP Cart</span>
        </a>
        <span class="member-chip" th:text="|Member #${memberId}|">Member #1</span>
    </div>
</header>

<main class="page">
    <section class="summary">
        <div>
            <h1>강의 목록</h1>
            <h2 th:text="${courseMessage}">담긴 강의 0개</h2>
        </div>
    </section>

    <section>
        <h2 class="section-heading">수강 가능한 강의</h2>
        <div class="course-grid">
            <article class="course-card" th:each="course : ${courses}">
                <div class="thumbnail">
                    <img th:if="${course.thumbnailUrl() != null}" th:src="${course.thumbnailUrl()}" th:alt="${course.title()}">
                    <span th:if="${course.thumbnailUrl() == null}" th:text="${#strings.substring(course.title(), 0, 1)}">C</span>
                </div>
                <div class="course-body">
                    <h2 th:text="${course.title()}">강의 제목</h2>
                    <p class="description" th:text="${course.description()}">강의 설명</p>
                    <div class="meta">
                        <span th:text="|Course #${course.courseId()}|">Course #1</span>
                        <span th:text="${course.level()}">EASY</span>
                        <strong class="price" th:text="${#numbers.formatInteger(course.price(), 0, 'COMMA')} + '원'">30,000원</strong>
                    </div>
                    <div class="course-actions">
                        <form th:if="${!cartCourseIds.contains(course.courseId())}" th:action="@{/cart-ui}" method="post">
                            <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <input type="hidden" name="memberId" th:value="${memberId}">
                            <input type="hidden" name="courseId" th:value="${course.courseId()}">
                            <button class="primary-button" type="submit">장바구니 담기</button>
                        </form>
                        <button class="done-button" type="button" th:if="${cartCourseIds.contains(course.courseId())}" disabled>담김</button>
                    </div>
                </div>
            </article>
        </div>
    </section>

    <section>
        <div class="cart-header">
            <h2 class="section-heading">내 장바구니</h2>
            <div class="cart-actions" th:if="${!#lists.isEmpty(carts)}">
                <div class="cart-total" data-cart-total>
                    <span>전체 금액</span>
                    <strong th:text="${#numbers.formatInteger(totalPrice, 0, 'COMMA')} + '원'">0원</strong>
                </div>
                <button class="primary-button" type="button">주문하기</button>
                <form th:action="@{/cart-ui/delete-all}" method="post">
                    <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <input type="hidden" name="memberId" th:value="${memberId}">
                    <button class="danger-button" type="submit">전체 삭제하기</button>
                </form>
            </div>
        </div>

        <div class="cart-list" th:if="${!#lists.isEmpty(carts)}">
            <article class="cart-item" th:each="cart : ${carts}">
                <div class="thumbnail">
                    <img th:if="${cart.thumbnailUrl != null}" th:src="${cart.thumbnailUrl}" th:alt="${cart.title}">
                    <span th:if="${cart.thumbnailUrl == null}" th:text="${#strings.substring(cart.title, 0, 1)}">C</span>
                </div>
                <div class="item-body">
                    <h2 th:text="${cart.title}">강의 제목</h2>
                    <p class="description" th:text="${cart.description}">강의 설명</p>
                    <div class="meta">
                        <span th:text="|Course #${cart.courseId}|">Course #1</span>
                        <span th:if="${cart.member != null}" th:text="|수강생 ${cart.member.nickname}|">수강생 nickname</span>
                        <strong class="price" th:text="${#numbers.formatInteger(cart.price, 0, 'COMMA')} + '원'">30,000원</strong>
                    </div>
                    <div class="item-actions">
                        <form th:action="@{/cart-ui/delete}" method="post">
                            <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <input type="hidden" name="memberId" th:value="${memberId}">
                            <input type="hidden" name="courseId" th:value="${cart.courseId}">
                            <button class="secondary-button" type="submit">삭제</button>
                        </form>
                    </div>
                </div>
            </article>
        </div>

        <div class="empty" th:if="${#lists.isEmpty(carts)}">
            <div>
                <h2>장바구니에 담긴 강의가 없습니다.</h2>
                <p>위 강의 목록에서 원하는 강의를 장바구니에 담아보세요.</p>
            </div>
        </div>
    </section>
</main>
<script>
    const header = document.querySelector(".site-header");
    const cartHeader = document.querySelector(".cart-header");

    function updateCartStickyTop() {
        if (!cartHeader) {
            return;
        }

        const headerHeight = header ? header.getBoundingClientRect().height : 0;
        document.documentElement.style.setProperty("--cart-sticky-top", `${headerHeight + 12}px`);
    }

    updateCartStickyTop();
    window.addEventListener("resize", updateCartStickyTop);
</script>
</body>
</html>
