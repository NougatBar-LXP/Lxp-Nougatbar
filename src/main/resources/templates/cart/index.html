<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta content="width=device-width, initial-scale=1" name="viewport">
  <title>LXP Cart</title>

  <link crossorigin="anonymous"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/global/theme.css}">
  <link rel="stylesheet" th:href="@{/css/global/header.css}">

  <style>
    :root {
      --cart-bg: #f7f7fc;
      --cart-panel: #ffffff;
      --cart-border: #e2e4f0;
      --cart-text: #1f2937;
      --cart-muted: #6b7280;
      --cart-primary: #6423d6;
      --cart-primary-dark: #4f16bb;
      --cart-danger: #b64a45;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--cart-bg);
      color: var(--cart-text);
    }

    main {
      flex: 1;
    }

    .cart-shell {
      max-width: 1120px;
      margin: 0 auto;
      padding: 34px 18px 56px;
    }

    .cart-title {
      margin-bottom: 28px;
      font-size: 32px;
      font-weight: 500;
      letter-spacing: 0;
    }

    .cart-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 276px;
      gap: 48px;
      align-items: start;
    }

    .section-title {
      margin-bottom: 18px;
      font-size: 18px;
      font-weight: 500;
    }

    .selected-list {
      display: grid;
      gap: 12px;
    }

    .course-row {
      display: grid;
      grid-template-columns: 120px minmax(0, 1fr) auto;
      gap: 18px;
      min-height: 132px;
      align-items: start;
      border: 1px solid var(--cart-border);
      border-radius: 8px;
      padding: 18px;
      background: var(--cart-panel);
    }

    .course-thumb {
      width: 120px;
      height: 76px;
      border-radius: 5px;
      object-fit: cover;
      background: #eef0f6;
    }

    .course-body {
      min-width: 0;
    }

    .course-title {
      margin: 1px 0 10px;
      overflow: hidden;
      font-size: 18px;
      font-weight: 500;
      line-height: 1.35;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .course-meta {
      margin: 0;
      color: var(--cart-muted);
      font-size: 13px;
    }

    .course-side {
      display: flex;
      min-width: 124px;
      flex-direction: column;
      align-items: end;
      justify-content: space-between;
      align-self: stretch;
    }

    .remove-button {
      display: inline-flex;
      width: 28px;
      height: 28px;
      align-items: center;
      justify-content: center;
      border: 0;
      background: transparent;
      color: #35394a;
      font-size: 26px;
      line-height: 1;
    }

    .course-price {
      color: var(--cart-primary);
      font-size: 20px;
      font-weight: 700;
    }

    .empty-state {
      border: 1px solid var(--cart-border);
      border-radius: 8px;
      padding: 34px;
      background: var(--cart-panel);
      color: var(--cart-muted);
    }

    .divider {
      margin: 48px 0;
      border-color: var(--cart-border);
      opacity: 1;
    }

    .payment-options {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 142px));
      gap: 12px;
    }

    .pay-option {
      position: relative;
      min-height: 76px;
      border: 1px solid #d6d9e6;
      border-radius: 8px;
      background: #fff;
      color: #4b5563;
      font-size: 13px;
      font-weight: 500;
    }

    .pay-option.active {
      border: 2px solid var(--cart-primary);
      color: var(--cart-primary);
    }

    .pay-option.active::after {
      content: "";
      position: absolute;
      top: 0;
      right: 0;
      border-top: 18px solid var(--cart-primary);
      border-left: 18px solid transparent;
      border-top-right-radius: 6px;
    }

    .summary-card {
      position: sticky;
      top: 92px;
      border: 1px solid var(--cart-border);
      border-radius: 8px;
      padding: 30px;
      background: var(--cart-panel);
      box-shadow: 0 8px 22px rgba(15, 23, 42, 0.04);
    }

    .summary-title {
      margin-bottom: 30px;
      font-size: 18px;
      font-weight: 500;
    }

    .summary-line {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
      color: #5f6678;
      font-size: 13px;
    }

    .summary-line strong {
      color: #35394a;
      font-weight: 500;
    }

    .summary-line.discount strong {
      color: var(--cart-danger);
    }

    .summary-divider {
      margin: 32px 0 24px;
      border-color: var(--cart-border);
      opacity: 1;
    }

    .final-line {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 32px;
      font-size: 14px;
    }

    .final-price {
      color: var(--cart-primary);
      font-size: 29px;
      font-weight: 400;
      white-space: nowrap;
    }

    .checkout-button {
      width: 100%;
      min-height: 52px;
      border: 0;
      border-radius: 6px;
      background: var(--cart-primary);
      color: #fff;
      font-weight: 600;
    }

    .checkout-button:hover {
      background: var(--cart-primary-dark);
    }

    .policy-box {
      margin-top: 18px;
      border-radius: 6px;
      padding: 14px;
      background: #f0f1f8;
      color: #697083;
      font-size: 11px;
      line-height: 1.55;
    }

    @media (max-width: 900px) {
      .cart-layout {
        grid-template-columns: 1fr;
        gap: 28px;
      }

      .summary-card {
        position: static;
      }
    }

    @media (max-width: 640px) {
      .cart-shell {
        padding-inline: 14px;
      }

      .course-row {
        grid-template-columns: 92px minmax(0, 1fr);
      }

      .course-thumb {
        width: 92px;
        height: 64px;
      }

      .course-side {
        grid-column: 1 / -1;
        min-width: 0;
        flex-direction: row;
        align-items: center;
      }

      .payment-options {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
<div th:replace="~{fragments/header::header}"></div>

<main>
  <div class="cart-shell">
    <h1 class="cart-title">장바구니</h1>

    <div class="cart-layout">
      <section>
        <h2 class="section-title">선택한 강좌</h2>

        <div class="selected-list" th:if="${!#lists.isEmpty(carts)}">
          <article class="course-row" th:each="cart : ${carts}">
            <img alt="강의 썸네일"
                 class="course-thumb"
                 th:alt="${cart.title}"
                 th:attr="onerror=|this.onerror=null;this.src='@{/images/nougatbar.png}';|"
                 th:src="${cart.thumbnailUrl != null ? cart.thumbnailUrl : '/images/nougatbar.png'}">

            <div class="course-body">
              <h3 class="course-title" th:text="${cart.title}">강좌명</h3>
              <p class="course-meta">
                <span th:if="${cart.member != null}" th:text="|강사: ${cart.member.nickname}|">강사: Nougat</span>
                <span th:if="${cart.member == null}">강사: Nougat</span>
                <span> · 온라인 강의</span>
              </p>
            </div>

            <div class="course-side">
              <form method="post" th:action="@{/cart-ui/delete}">
                <input th:if="${_csrf != null}" th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}"
                       type="hidden">
                <input name="courseId" th:value="${cart.courseId}" type="hidden">
                <button aria-label="삭제" class="remove-button" type="submit">&times;</button>
              </form>
              <strong class="course-price"
                      th:text="'₩ ' + ${#numbers.formatInteger(cart.price, 0, 'COMMA')}">₩
                0</strong>
            </div>
          </article>
        </div>

        <div class="empty-state" th:if="${#lists.isEmpty(carts)}">
          장바구니에 담긴 강의가 없습니다.
          <a class="ms-1" th:href="@{/courses}">강의 목록으로 이동</a>
        </div>

        <hr class="divider">

        <section>
          <h2 class="section-title">결제 수단</h2>
          <div class="payment-options">
            <button class="pay-option active" type="button">신용카드</button>
            <button class="pay-option" type="button">계좌이체</button>
            <button class="pay-option" type="button">간편결제</button>
          </div>
        </section>
      </section>

      <aside class="summary-card">
        <h2 class="summary-title">결제 상세</h2>

        <div class="summary-line">
          <span>총 상품 금액</span>
          <strong th:text="'₩ ' + ${#numbers.formatInteger(totalPrice, 0, 'COMMA')}">₩ 0</strong>
        </div>
        <div class="summary-line discount">
          <span>할인 금액</span>
          <strong>- ₩ 0</strong>
        </div>

        <hr class="summary-divider">

        <div class="final-line">
          <span>최종 결제 금액</span>
          <strong class="final-price"
                  th:text="'₩' + ${#numbers.formatInteger(totalPrice, 0, 'COMMA')}">₩0</strong>
        </div>

        <form method="post" th:action="@{/order-ui}">
          <input th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"
                 type="hidden">
          <button class="checkout-button" th:disabled="${#lists.isEmpty(carts)}" type="submit">
            결제하기
          </button>
        </form>

        <div class="policy-box">
          가격 스냅샷 정책: 장바구니에 담긴 상품의 가격은 결제 시점의 가격 기준으로 적용되며,
          할인 시점과 다를 수 있습니다.
        </div>
      </aside>
    </div>
  </div>
</main>

<div th:replace="~{fragments/footer::footer}"></div>

<script crossorigin="anonymous"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
