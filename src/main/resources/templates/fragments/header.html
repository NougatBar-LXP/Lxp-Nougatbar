<header class="bg-white border-bottom site-header" th:fragment="header"
        xmlns:sec="http://www.w3.org/1999/xhtml">
  <div class="container py-3">
    <div class="d-flex flex-wrap align-items-center gap-3">
      <a class="text-decoration-none d-flex align-items-center gap-2" href="/">
        <span class="fw-bold text-primary fs-5">ConnectLearn</span>
      </a>
      <nav class="d-flex flex-wrap align-items-center gap-2 gap-md-3 me-auto px-3">
        <a class="btn btn-link text-decoration-none fw-semibold p-0 header-nav-link"
           th:href="@{/courses}">코스 탐색</a>
        <a class="btn btn-link text-decoration-none fw-semibold p-0 header-nav-link"
           th:href="@{/enrollment-ui}">내 학습</a>
      </nav>
      <div class="d-flex align-items-center gap-2">
        <!-- 로그인 전 버튼 표시 -->
        <th:block sec:authorize="isAnonymous()">
          <a class="btn btn-primary rounded-pill px-4 ms-auto" th:href="@{/auth/login}">로그인</a>
          <a class="btn btn-outline-primary rounded-pill px-4 ms-2"
             th:href="@{/auth/register}">회원가입</a>
        </th:block>

        <!-- 로그인 후 프로필 표시 -->
        <th:block sec:authorize="isAuthenticated()">
          <a class="btn btn-outline-primary rounded-pill px-4 ms-2" th:href="@{/cart-ui}">장바구니</a>
          <div class="dropdown">
            <button aria-expanded="false" aria-haspopup="true"
                    class="btn btn-outline-secondary rounded-circle p-0 header-profile"
                    data-bs-toggle="dropdown" id="headerUserProfileDropdown" type="button">
              <img alt="프로필 이미지" class="rounded-circle"
                   style="width: 100%; height: 100%; object-fit: cover;"
                   th:src="@{/images/nougatbar.png}">
            </button>
            <ul aria-labelledby="headerUserProfileDropdown" class="dropdown-menu">
              <li><a class="dropdown-item" th:href="@{/me}">내 프로필</a></li>
              <li>
                <hr class="dropdown-divider">
              </li>
              <!-- 로그아웃은 POST 요청이 필요하므로 form으로 처리 -->
              <li>
                <form method="post" th:action="@{/auth/logout}">
                  <button class="dropdown-item" type="submit">로그아웃</button>
                </form>
              </li>
            </ul>
          </div>
        </th:block>
      </div>
    </div>
  </div>
</header>
