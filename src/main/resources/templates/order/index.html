<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta content="width=device-width, initial-scale=1" name="viewport">
  <title>ConnectLearn - 주문 내역</title>

  <link crossorigin="anonymous"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/global/theme.css}">
  <link rel="stylesheet" th:href="@{/css/global/header.css}">

  <style>
    :root {
      --page-bg: #f8f8ff;
      --panel: #ffffff;
      --line: #dfe3f0;
      --text: #1f2430;
      --muted: #687083;
      --primary: #6423d6;
      --primary-soft: #f0e9ff;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--page-bg);
      color: var(--text);
    }

    main {
      flex: 1;
    }

    .order-shell {
      max-width: 1120px;
      margin: 0 auto;
      padding: 42px 18px 72px;
    }

    .page-title {
      margin-bottom: 10px;
      font-size: 34px;
      font-weight: 800;
      letter-spacing: 0;
    }

    .page-subtitle {
      margin-bottom: 36px;
      color: var(--muted);
      font-size: 16px;
    }

    .order-layout {
      display: grid;
      grid-template-columns: 340px minmax(0, 1fr);
      gap: 24px;
      align-items: start;
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--panel);
      box-shadow: 0 12px 26px rgba(31, 36, 48, 0.04);
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 1px solid var(--line);
      padding: 18px 20px;
    }

    .panel-title {
      margin: 0;
      font-size: 18px;
      font-weight: 800;
    }

    .count-pill,
    .status-pill {
      border-radius: 999px;
      padding: 6px 10px;
      background: var(--primary-soft);
      color: var(--primary);
      font-size: 12px;
      font-weight: 800;
    }

    .order-list {
      display: grid;
      gap: 10px;
      padding: 14px;
    }

    .order-link {
      display: grid;
      gap: 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px;
      color: inherit;
      text-decoration: none;
      background: #fff;
    }

    .order-link.active {
      border-color: var(--primary);
      box-shadow: inset 4px 0 0 var(--primary);
    }

    .order-link-title {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      font-weight: 800;
    }

    .order-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 12px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
    }

    .detail-body {
      display: grid;
      gap: 18px;
      padding: 20px;
    }

    .detail-total {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      border-bottom: 1px solid var(--line);
      padding-bottom: 18px;
    }

    .detail-total span {
      color: var(--muted);
      font-weight: 700;
    }

    .detail-total strong {
      color: var(--primary);
      font-size: 28px;
      font-weight: 500;
    }

    .line-list {
      display: grid;
      gap: 14px;
    }

    .line-item {
      display: grid;
      grid-template-columns: 132px minmax(0, 1fr) auto;
      gap: 18px;
      align-items: start;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
      background: #fff;
    }

    .line-thumb {
      width: 132px;
      height: 82px;
      border-radius: 6px;
      object-fit: cover;
      background: #eef0f6;
    }

    .line-title {
      margin: 0 0 8px;
      overflow: hidden;
      font-size: 18px;
      font-weight: 800;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .line-description {
      display: -webkit-box;
      overflow: hidden;
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
    }

    .line-price {
      color: var(--primary);
      font-size: 18px;
      font-weight: 800;
      white-space: nowrap;
    }

    .empty-state {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 34px;
      background: #fff;
      color: var(--muted);
    }

    @media (max-width: 900px) {
      .order-layout {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 640px) {
      .line-item {
        grid-template-columns: 92px minmax(0, 1fr);
      }

      .line-thumb {
        width: 92px;
        height: 64px;
      }

      .line-price {
        grid-column: 1 / -1;
      }
    }
  </style>
</head>
<body>
<div th:replace="~{fragments/header::header}"></div>

<main>
  <div class="order-shell">
    <h1 class="page-title">주문 내역</h1>
    <p class="page-subtitle" th:text="|총 ${orderCount}건의 주문 내역이 있습니다.|">총 0건의 주문 내역이 있습니다.</p>

    <section class="empty-state" th:if="${#lists.isEmpty(orders)}">
      아직 주문 내역이 없습니다.
      <a class="ms-1" th:href="@{/cart-ui}">장바구니로 이동</a>
    </section>

    <section class="order-layout" th:if="${!#lists.isEmpty(orders)}">
      <aside class="panel">
        <div class="panel-header">
          <h2 class="panel-title">주문 목록</h2>
          <span class="count-pill" th:text="${orderCount}">0</span>
        </div>

        <div class="order-list">
          <a class="order-link"
             th:classappend="${selectedOrder != null and selectedOrder.orderId() == order.orderId()} ? ' active'"
             th:each="order : ${orders}"
             th:href="@{/order-ui/{orderId}(orderId=${order.orderId()})}">
            <div class="order-link-title">
              <span th:text="|Order #${order.orderId()}|">Order #1</span>
              <strong th:text="'₩ ' + ${#numbers.formatInteger(order.total(), 0, 'COMMA')}">₩ 0</strong>
            </div>
            <div class="order-meta">
              <span th:text="${order.status()}">PENDING</span>
              <span th:text="|${order.orderLineCount()}개 강의|">0개 강의</span>
              <span th:text="${#temporals.format(order.createdAt(), 'yyyy.MM.dd HH:mm')}">2026.05.22 10:00</span>
            </div>
          </a>
        </div>
      </aside>

      <article class="panel" th:if="${selectedOrder != null}">
        <div class="panel-header">
          <h2 class="panel-title" th:text="|Order #${selectedOrder.orderId()}|">Order #1</h2>
          <span class="status-pill" th:text="${selectedOrder.status()}">PENDING</span>
        </div>

        <div class="detail-body">
          <div class="detail-total">
            <span>최종 결제 금액</span>
            <strong th:text="'₩' + ${#numbers.formatInteger(selectedOrder.total(), 0, 'COMMA')}">₩0</strong>
          </div>

          <div class="order-meta">
            <span th:text="|주문자 Member #${selectedOrder.memberId()}|">주문자 Member #1</span>
            <span th:text="${#temporals.format(selectedOrder.createdAt(), 'yyyy.MM.dd HH:mm')}">2026.05.22 10:00</span>
          </div>

          <div class="line-list">
            <section class="line-item" th:each="line : ${selectedOrder.orderLines()}">
              <img alt="강의 썸네일"
                   class="line-thumb"
                   th:alt="${line.title()}"
                   th:attr="onerror=|this.onerror=null;this.src='@{/images/nougatbar.png}';|"
                   th:src="${line.thumbnailUrl() != null ? line.thumbnailUrl() : '/images/nougatbar.png'}">

              <div>
                <h3 class="line-title" th:text="${line.title()}">강의 제목</h3>
                <p class="line-description" th:text="${line.description()}">강의 설명</p>
                <div class="order-meta mt-2">
                  <span th:text="|Course #${line.courseId()}|">Course #1</span>
                </div>
              </div>

              <strong class="line-price" th:text="'₩ ' + ${#numbers.formatInteger(line.price(), 0, 'COMMA')}">₩ 0</strong>
            </section>
          </div>
        </div>
      </article>
    </section>
  </div>
</main>

<div th:replace="~{fragments/footer::footer}"></div>

<script crossorigin="anonymous"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
